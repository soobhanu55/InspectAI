apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  labels: {app: mosquitto}
spec:
  replicas: 1
  selector: {matchLabels: {app: mosquitto}}
  template:
    metadata: {labels: {app: mosquitto}}
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          ports: [{containerPort: 1883}]
          volumeMounts: [{name: config, mountPath: /mosquitto/config/mosquitto.conf, subPath: mosquitto.conf, readOnly: true}]
          readinessProbe: {tcpSocket: {port: 1883}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: 1883}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {memory: 128Mi}}
          securityContext: {runAsNonRoot: true, runAsUser: 1883, runAsGroup: 1883, allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
      volumes: [{name: config, configMap: {name: mosquitto-config}}]
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
spec:
  selector: {app: mosquitto}
  ports: [{port: 1883, targetPort: 1883}]
