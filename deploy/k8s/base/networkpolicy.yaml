# Default: nothing may reach anything in the namespace; the rules below open exactly the paths the pipeline uses.
# They only take effect if the cluster's network plugin enforces NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: redis-from-pipeline}
spec:
  podSelector: {matchLabels: {app: redis}}
  ingress:
    - from:
        - podSelector: {matchLabels: {app: backend}}
        - podSelector: {matchLabels: {app: stream-worker}}
        - podSelector: {matchLabels: {app: mqtt-bridge}}
      ports: [{port: 6379}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: mosquitto-from-bridge-and-cameras}
spec:
  podSelector: {matchLabels: {app: mosquitto}}
  ingress:
    - from:
        - podSelector: {matchLabels: {app: mqtt-bridge}}
        - podSelector: {matchLabels: {role: camera}}
      ports: [{port: 1883}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: timescaledb-from-app}
spec:
  podSelector: {matchLabels: {app: timescaledb}}
  ingress:
    - from:
        - podSelector: {matchLabels: {app: backend}}
        - podSelector: {matchLabels: {app: stream-worker}}
      ports: [{port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api-and-metrics-open-in-namespace}
spec:
  podSelector:
    matchExpressions: [{key: app, operator: In, values: [backend, stream-worker]}]
  ingress:
    - from: [{podSelector: {}}]
      ports: [{port: 7860}, {port: 9108}]
