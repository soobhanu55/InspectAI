apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inspectai
resources: [namespace.yaml, config.yaml, redis.yaml, mosquitto.yaml, timescaledb.yaml, app.yaml, networkpolicy.yaml]
labels:
  - pairs: {app.kubernetes.io/part-of: inspectai}
    includeSelectors: false
# The database password is not in the repository. Create the secret before applying:
#   kubectl create namespace inspectai
#   kubectl -n inspectai create secret generic timescaledb-credentials --from-literal=password="$(openssl rand -hex 16)"
