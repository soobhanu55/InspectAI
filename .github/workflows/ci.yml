name: CI
on: [push, pull_request]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      redis:   # the broker tests also run against a real Redis (locally they use fakeredis and an in-memory broker)
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      timescaledb:   # hypertable, continuous aggregate and retention policy are tested against the real extension
        image: timescale/timescaledb:latest-pg16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: inspect}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d inspect" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies for OpenCV/YOLO and an MQTT broker
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 mosquitto
          sudo systemctl stop mosquitto
          echo "listener 1883 127.0.0.1" > /tmp/mosquitto.conf
          echo "allow_anonymous true" >> /tmp/mosquitto.conf
          mosquitto -c /tmp/mosquitto.conf -d
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install torch==2.5.1+cpu torchvision==0.20.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r backend/requirements.txt pytest-cov
      - run: python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab'); nltk.download('stopwords')"
      - name: Run pytest
        shell: bash
        working-directory: backend   # weights are loaded relative to backend/
        run: |
          pytest tests/ -v --tb=short --cov=monitoring --cov=streaming --cov=mlops --cov=api --cov-report=term --cov-fail-under=85 2>&1 | tee ../pytest_log.txt
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REDIS_URL: redis://localhost:6379/0
          MQTT_URL: mqtt://localhost:1883
          TIMESCALE_URL: postgresql://postgres:postgres@localhost:5432/inspect
          PYTHONPATH: .

      - name: Publish Pytest Logs on Failure
        if: always()
        run: |
          if [ -f pytest_log.txt ]; then
            echo '### Pytest Results' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat pytest_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: cd frontend && npm ci && npm run build

  kubernetes:
    # Deploys the whole stack to a throwaway kind cluster and pushes frames through it:
    # camera job -> MQTT (Mosquitto) -> bridge -> Redis Stream -> worker (YOLO) -> TimescaleDB -> API.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with: {cluster_name: inspectai}
      - name: Validate every manifest against the cluster API server
        run: |
          kubectl kustomize deploy/k8s/overlays/ci > /tmp/rendered.yaml
          kubectl apply --dry-run=server -f /tmp/rendered.yaml
      - name: Build the application image and load it into the cluster
        run: |
          docker build -t inspectai:ci .
          kind load docker-image inspectai:ci --name inspectai
      - name: Deploy
        run: |
          kubectl apply -f /tmp/rendered.yaml
          kubectl -n inspectai rollout status statefulset/timescaledb --timeout=300s
          for d in redis mosquitto backend stream-worker mqtt-bridge; do kubectl -n inspectai rollout status deployment/$d --timeout=600s; done
      - name: Smoke test, 40 synthetic frames from MQTT to TimescaleDB
        run: |
          kubectl -n inspectai wait --for=condition=complete job/smoke-camera --timeout=300s
          kubectl -n inspectai port-forward svc/backend 7860:80 &
          sleep 5
          python3 - <<'PY'
          import json, time, urllib.request
          def get(path):
              return json.load(urllib.request.urlopen("http://localhost:7860" + path, timeout=10))
          deadline, frames = time.time() + 180, 0
          while time.time() < deadline and frames < 40:
              frames = sum(b["frames"] for b in get("/api/mlops/timeseries?minutes=30&bucket=1%20hour")["buckets"])
              time.sleep(3)
          status = get("/api/stream/status")
          print("frames in TimescaleDB:", frames, "| stream status:", status)
          assert frames >= 40, "frames did not make it through the pipeline"
          assert status["configured"] and status["lag"] == 0
          PY
      - name: Autoscaler and network policies exist
        run: |
          kubectl -n inspectai get hpa backend
          test "$(kubectl -n inspectai get networkpolicy -o name | wc -l)" -ge 5
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n inspectai get all,pvc,events || true
          kubectl -n inspectai describe pods || true
          for d in backend stream-worker mqtt-bridge mosquitto redis; do echo "=== $d"; kubectl -n inspectai logs deployment/$d --tail=80 || true; done
          kubectl -n inspectai logs job/smoke-camera --tail=40 || true
